name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:checkout
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/agent-package-smoke.mjs
